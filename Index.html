<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un detalle para ti</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --stem-color: #2d6a4f;
      --leaf-color: #40916c;
      --flower-yellow: #ffd166;
      --flower-core: #ff9f1c;
      --text-color: #f7fff7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at bottom, #1c2541 0%, var(--bg-color) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 65vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Tallo principal */
    .stem {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 0;
      background: linear-gradient(to top, var(--stem-color), #52b788);
      border-radius: 4px 4px 0 0;
      animation: growStem 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Flor */
    .flower {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 90px;
      height: 90px;
      animation: bloom 1.5s 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .petal {
      position: absolute;
      width: 32px;
      height: 48px;
      background: radial-gradient(circle at bottom, var(--flower-core), var(--flower-yellow));
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      left: calc(50% - 16px);
      top: calc(50% - 24px);
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.4);
    }

    .petal:nth-child(1) { transform: rotate(0deg) translateY(-22px); }
    .petal:nth-child(2) { transform: rotate(45deg) translateY(-22px); }
    .petal:nth-child(3) { transform: rotate(90deg) translateY(-22px); }
    .petal:nth-child(4) { transform: rotate(135deg) translateY(-22px); }
    .petal:nth-child(5) { transform: rotate(180deg) translateY(-22px); }
    .petal:nth-child(6) { transform: rotate(225deg) translateY(-22px); }
    .petal:nth-child(7) { transform: rotate(270deg) translateY(-22px); }
    .petal:nth-child(8) { transform: rotate(315deg) translateY(-22px); }

    .flower-center {
      position: absolute;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #ffe3a8, var(--flower-core));
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.2);
    }

    /* Hojas a lo largo del tallo */
    .leaf {
      position: absolute;
      width: 38px;
      height: 20px;
      background: var(--leaf-color);
      border-radius: 0 50% 0 50%;
      opacity: 0;
      transform: scale(0);
      animation: growLeaf 1s forwards cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .leaf--left {
      left: -32px;
      transform-origin: right center;
      animation-delay: var(--delay, 1.5s);
    }

    .leaf--right {
      right: -32px;
      transform-origin: left center;
      transform: scaleX(-1);
      animation-delay: var(--delay, 1.8s);
    }

    /* Mensaje central inferior */
    .message-card {
      padding: 18px 24px;
      margin-bottom: 40px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      color: var(--text-color);
      text-align: center;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeIn 1.2s 3.2s ease-out forwards;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 85%;
    }

    /* Animaciones */
    @keyframes growStem {
      to { height: 260px; }
    }

    @keyframes bloom {
      to { transform: translateX(-50%) scale(1); }
    }

    @keyframes growLeaf {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="stem">
      <!-- Flor en la punta -->
      <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="flower-center"></div>
      </div>

      <!-- Hojas con delays secuenciales -->
      <div class="leaf leaf--left" style="bottom: 70px; --delay: 1.2s;"></div>
      <div class="leaf leaf--right" style="bottom: 120px; --delay: 1.6s;"></div>
      <div class="leaf leaf--left" style="bottom: 170px; --delay: 2.0s;"></div>
    </div>
  </div>

  <div class="message-card">
    Estas flores amarillas son para ti
  </div>

</body>
</html>
